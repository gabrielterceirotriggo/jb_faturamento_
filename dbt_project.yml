name: "jb_faturamento"
version: "2.5.0"

profile: "credentials"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  jb_faturamento:
    # Staging layer - minimal transformations, views for performance
    staging:
      +materialized: view
      +tags: ["staging"]
      +description: "Raw data models with minimal transformations"

    # Intermediate layer - complex business logic, tables for performance
    intermediate:
      +materialized: table
      +tags: ["intermediate"]
      +description: "Complex business logic and data preparation"

    # Marts layer - final presentation layer, tables for end users
    marts:
      +materialized: table
      +tags: ["marts"]
      +description: "Final presentation layer for business users"

# Global variables
vars:
  # Date configuration
  dia_fim: "{{ modules.datetime.date.today().strftime('%Y%m%d') }}"

  # Source system configuration
  database_raw: "eqtlinfo_raw"
  database_prd: "eqtlinfo_prd"
  source_param: "eqtl_ma"
  source_orig: "ccs_ma"

# Documentation
docs-paths: ["docs"]
