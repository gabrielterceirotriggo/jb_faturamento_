name: "jb_faturamento"
version: "2.5.0"

profile: "credentials"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  jb_faturamento:
    intermediate:
      +materialized: table
      +query_tag: int_jb_faturamento
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +query_tag: mart_jb_faturamento
      +tags: ["marts"]
    staging:
      +materialized: view
      +query_tag: stg_jb_faturamento
      +tags: ["staging"]

# Global variables
vars:
  # Date configuration
  dia_fim: "{{ modules.datetime.date.today().strftime('%Y%m%d') }}"

  # Source system configuration
  database_raw: "EQTLINFO_RAW"
  database_prd: "EQTLINFO_PRD"
  source_param: "EQTL_MA"
  source_orig: "CCS_MA"

# Documentation
docs-paths: ["docs"]

