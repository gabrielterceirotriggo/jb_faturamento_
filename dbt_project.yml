name: "jb_faturamento"
version: "2.5.0"

profile: "credentials"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  jb_faturamento:
    # Staging layer - minimal transformations, views for performance
    staging:
      +materialized: view
      +tags: ["staging"]
      +description: "Raw data models with minimal transformations"

    # Intermediate layer - complex business logic, tables for performance
    intermediate:
      +materialized: table
      +tags: ["intermediate"]
      +description: "Complex business logic and data preparation"

    # Marts layer - final presentation layer, tables for end users
    marts:
      +materialized: table
      +tags: ["marts"]
      +description: "Final presentation layer for business users"

# Global variables
vars:
  # Date configuration
  dia_fim: "{{ modules.datetime.date.today().strftime('%Y%m%d') }}"

  # Source system configuration
  source_param: "EQTL_AP" # Current source system
  source_orig: "CCS_AP" # Original source system

  # Business configuration
  consumption_tolerance: 1000 # Tolerance for consumption differences
  max_processing_days: 90 # Maximum days to process in incremental runs

# Warehouse configuration (commented out for safety)
# on-run-start: "alter warehouse WH_CARGAS_CRITICAS set warehouse_size = 'medium'"
# on-run-end: "alter warehouse WH_CARGAS_CRITICAS set warehouse_size = 'small'"

# Test configurations
tests:
  +warn_if: ">1000"
  +error_if: ">10000"

# Documentation
docs-paths: ["docs"]
