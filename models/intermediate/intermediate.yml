version: 2

models:
  - name: int_documentos_faturamento
    description: "Intermediate model that processes and classifies billing documents, handling both regular calculations and full reversals. This model unifies document processing logic and applies business rules for document classification."
    config:
      tags: ["intermediate", "billing", "documents"]
    columns:
      - name: mandt
        description: "Client/Mandant identifier"

      - name: doc_calculo
        description: "Calculation document number"

      - name: doc_impressao
        description: "Print document number"

      - name: tipo_calculo
        description: "Calculation type"
      - name: tipo_documento
        description: "Document type"
      - name: estorno
        description: "Reversal indicator"
      - name: mes_competencia
        description: "Competency month"

  - name: int_estornados_delta
    description: "Delta processing for reversal documents, identifying and processing documents that have been reversed or adjusted."
    config:
      tags: ["intermediate", "billing", "reversals"]
    columns:
      - name: mes_competencia
        description: "Competency month"

      - name: documento_calculo
        description: "Calculation document"

      - name: documento_impressao
        description: "Print document"

      - name: tipo_estorno
        description: "Reversal type"
      - name: motivo_estorno
        description: "Reversal reason"

  - name: int_consumo_delta
    description: "Delta processing for consumption data, calculating consumption differences and adjustments."
    config:
      tags: ["intermediate", "billing", "consumption"]
    columns:
      - name: mes_competencia
        description: "Competency month"

      - name: instalacao
        description: "Installation"

      - name: consumo_anterior
        description: "Previous consumption"
      - name: consumo_atual
        description: "Current consumption"
      - name: diferenca_consumo
        description: "Consumption difference"

  - name: faturamento_delta
    description: "Incremental billing data processing, containing only new or changed billing records for efficient processing."
    config:
      tags: ["intermediate", "billing", "delta"]
    columns:
      - name: mes_competencia
        description: "Competency month"

      - name: documento_calculo
        description: "Calculation document"

      - name: documento_impressao
        description: "Print document"

      - name: valor_fatura
        description: "Invoice amount"
      - name: valor_contabil
        description: "Accounting amount"

  - name: int_ordem_faturamento
    description: "Billing order processing and sequencing logic."
