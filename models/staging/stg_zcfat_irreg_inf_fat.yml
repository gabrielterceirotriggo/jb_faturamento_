      - name: ajus_user
        description: "User adjustment"
      - name: rpnum
        description: "RP number"
      - name: atualiz_monet
        description: "Monetary update"
      - name: calc_juros
        description: "Interest calculation"
      - name: alter_manual
        description: "Manual change"
      - name: status_wf
        description: "Workflow status"
      - name: workitem
        description: "Work item"
      - name: opbel_j
        description: "Print document J"
      - name: opbel_cm
