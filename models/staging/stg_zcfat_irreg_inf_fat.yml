version: 2

models:
  - name: stg_zcfat_irreg_inf_fat
    description: "Staging model for ZCFAT_IRREG_INF (irregular billing information) table. Contains irregular billing data including consumption estimates, billing periods, and irregular reading information."
    config:
      tags: ["staging", "billing", "irregular"]
    columns:
      - name: mandt
        description: "Client/Mandant identifier"
      - name: belnr
        description: "Billing document number"
      - name: belzart
        description: "Billing document type"
      - name: vertrag
        description: "Contract number"
      - name: anlage
        description: "Installation number"
      - name: adat
        description: "Date"
      - name: status
        description: "Status"
      - name: invoiced
        description: "Invoiced indicator"
      - name: grupo_estim
        description: "Estimation group"
      - name: qtde_dias
        description: "Number of days"
      - name: qtde_dias_fat
        description: "Number of days billed"
      - name: qtde_dias_nfat
        description: "Number of days not billed"
      - name: qtde_faturas
        description: "Number of invoices"
      - name: cons_total
        description: "Total consumption"
      - name: cons_diario
        description: "Daily consumption"
      - name: cons_faturado
        description: "Billed consumption"
      - name: cons_atual
        description: "Current consumption"
      - name: cons_ajuste
        description: "Adjustment consumption"
      - name: leit_anterior
        description: "Previous reading"
      - name: leit_atual
        description: "Current reading"
      - name: cons_media
