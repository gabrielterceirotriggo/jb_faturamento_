version: 2

sources:
  - name: "RAW"
    database: "{{ var('database_raw', 'eqtlinfo_raw') }}"
    schema: "{{ var('source_orig', 'ccs_ma') }}"
    config:
      freshness:
        warn_after: { count: 12, period: hour }
        error_after: { count: 24, period: hour }
    tables:
      - name: ERDK
        columns:
          - name: opbel
            tests:
              - unique
              - not_null
              - relationships:
                  to: source('RAW', 'ERCHC')
                  field: opbel
                  config:
                    where: "intopbel is null"
      - name: ERCHC
        columns:
          - name: belnr
            tests:
              - not_null
              - relationships:
                  to: source('RAW', 'ERCH')
                  field: belnr
          - name: opbel
            tests:
              - not_null
      - name: ERCH
        columns:
          - name: belnr
            tests:
              - unique
              - not_null
      - name: DBERCHZ1
      - name: DBERCHZ3
      - name: DBERDLB
      - name: DBERDL
      - name: ZFATT057_OPHIST
      - name: DBERCHZ5
      - name: DBERCHZ7
      - name: ETTIFN
      - name: EVER
      - name: ZCFAT_IRREG_INF
      - name: ZCFAT_IRREG_CAB
      - name: ETRG
      - name: DBERCHZ2
      - name: ETDZ
      - name: EZUZ
      - name: EGERH
      - name: TE835T

  - name: "PROD"
    database: "{{ var('database_prd', 'eqtlinfo_prd') }}"
    schema: "{{ var('source_param', 'eqtl_ma') }}"
    config:
      freshness:
        warn_after: { count: 12, period: hour }
        error_after: { count: 24, period: hour }
    tables:
      - name: TAB_CONTROLE_CARGAS
      - name: FATURAMENTO_OPERACOES
      - name: FATURAMENTO
